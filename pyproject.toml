[project]
name = "tech-support"
version = "0.1.0"
description = "Telegram bot that triages customer messages: bug vs out-of-scope request, effort, urgency"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
